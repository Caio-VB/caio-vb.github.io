<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel Administrativo - Recompensas</title>

  <!-- PWA Tags para o painel de Admin -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Admin">
  <meta name="theme-color" content="#200d02">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/924/924514.png">

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f6f3ee; color: #1e140d; min-height: 100vh; padding-bottom: 90px; }

    /* Top Bar Café */
    .top-header {
      background: linear-gradient(180deg, #3d1c06 0%, #200d02 100%);
      padding: 22px 20px 28px 20px;
      border-radius: 0 0 24px 24px;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 18px rgba(32, 13, 2, 0.25);
    }
    .header-info { display: flex; align-items: center; gap: 12px; }
    .header-logo {
      width: 44px;
      height: 44px;
      background: #faece3;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }
    .header-title { font-size: 17px; font-weight: 700; color: #ffffff; line-height: 1.2; }
    .header-sub { font-size: 12px; color: #d6bda8; margin-top: 2px; }

    .container { max-width: 460px; margin: 16px auto 0; padding: 0 16px; }

    /* Card Padrão */
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #efe8df;
      box-shadow: 0 3px 12px rgba(45, 24, 8, 0.03);
    }

    .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .card-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #faece3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #9a431a;
      flex-shrink: 0;
    }
    .card-title-group h2 { font-size: 16px; font-weight: 700; color: #1f140e; }
    .card-title-group p { font-size: 12px; color: #786b62; margin-top: 1px; }

    /* Formulários */
    .form-group { margin-bottom: 14px; position: relative; }
    .form-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #403024;
      margin-bottom: 6px;
    }
    .form-label svg { width: 14px; height: 14px; stroke: #9a431a; }

    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-field {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #e5ded6;
      border-radius: 10px;
      font-size: 14px;
      color: #1f140e;
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus { border-color: #9a431a; }
    .input-field::placeholder { color: #a89d94; font-size: 13px; }

    .btn-toggle-pass {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: #786b62;
      display: flex;
      align-items: center;
    }

    /* Seletor Câmera/Galeria */
    .img-upload-container { display: flex; align-items: center; gap: 12px; }
    .img-preview-box {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px dashed #c4b5a5;
      background: #fdfbf9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
    }
    #preview-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .img-preview-box img { width: 100%; height: 100%; object-fit: cover; }
    .btn-select-file {
      flex: 1; padding: 12px 14px; border: 1px dashed #c4b5a5; background: #faf7f2; border-radius: 10px;
      color: #735d4f; font-size: 13px; font-weight: 600; cursor: pointer; display: flex;
      align-items: center; justify-content: center; gap: 8px; transition: background 0.2s;
    }
    .btn-select-file:active { background: #ede3d7; }

    /* Botão Publicar */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #a0461b 0%, #8c3b12 100%);
      color: white; border: none; border-radius: 12px; padding: 13px; font-size: 14px;
      font-weight: 700; display: flex; align-items: center; justify-content: center;
      gap: 8px; cursor: pointer; box-shadow: 0 3px 8px rgba(140, 59, 18, 0.25); margin-top: 6px;
    }
    .btn-submit:disabled { background: #b8aba0; cursor: not-allowed; box-shadow: none; }

    /* Lista */
    .card-header-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .btn-refresh {
      width: 32px; height: 32px; border-radius: 8px; background: #ffffff; border: 1px solid #e8e1d8;
      display: flex; align-items: center; justify-content: center; cursor: pointer; color: #695c52;
    }
    .item-promo { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #f4efe9; }
    .item-promo:last-child { border-bottom: none; }
    .promo-thumb {
      width: 54px; height: 54px; border-radius: 50%; object-fit: cover; border: 1px solid #e8e0d5;
      flex-shrink: 0; background: #f7f2ec;
    }
    .promo-details { flex: 1; min-width: 0; }
    .promo-title { font-size: 14px; font-weight: 700; color: #1e140d; margin-bottom: 2px; }
    .promo-val { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px; color: #9a431a;}
    .btn-delete {
      background: #fef2f2; border: 1px solid #fee2e2; color: #dc2626; border-radius: 8px;
      padding: 6px 10px; font-size: 11px; font-weight: 600; display: flex; align-items: center;
      gap: 4px; cursor: pointer; flex-shrink: 0;
    }

    /* Barra Inferior */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #ffffff;
      border-top: 1px solid #eee8df; display: flex; justify-content: space-around; align-items: center; z-index: 100;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px;
      font-weight: 600; color: #94877d; text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .nav-item.active { color: #a0461b; }
    .nav-item svg { width: 22px; height: 22px; }

    /* Modais */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; backdrop-filter: blur(2px); }
    .sheet-box { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; border-radius: 24px 24px 0 0; padding: 26px 20px 32px; max-width: 460px; margin: 0 auto; z-index: 1000; transform: translateY(100%); transition: transform 0.3s ease-out; }
    .sheet-box.active { transform: translateY(0); }
    .sheet-title { font-size: 17px; font-weight: 700; color: #1f140e; text-align: center; margin-bottom: 6px; }
    .sheet-sub { font-size: 13px; color: #786b62; text-align: center; margin-bottom: 22px; }
    .btn-fechar-sheet { width: 100%; background: #f6f3ee; color: #403024; border: 1px solid #efe4d5; padding: 13px; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 14px; }
    
    .btn-media-option { width: 100%; background: #ffffff; border: 1px solid #eee6dc; padding: 12px 14px; border-radius: 14px; display: flex; align-items: center; gap: 14px; font-size: 14px; font-weight: 700; color: #332216; margin-bottom: 10px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.02); transition: background 0.15s, border-color 0.15s; }
    .btn-media-option:active { background: #faf5ee; border-color: #dfcebe; }
    .media-icon-container { width: 38px; height: 38px; border-radius: 10px; background: #faece3; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .msg-feedback { font-size: 13px; font-weight: 600; text-align: center; margin-top: 15px; display: none; padding: 10px; border-radius: 8px;}
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-header">
    <div class="header-info">
      <div class="header-logo">
        <img src="https://cdn-icons-png.flaticon.com/512/924/924514.png" alt="Logo" style="width: 24px; height: 24px; object-fit: contain;">
      </div>
      <div>
        <div class="header-title">Programa de Fidelidade</div>
        <div class="header-sub">Painel Administrativo</div>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Card 1: Nova Recompensa -->
    <div class="card">
      <div class="card-header">
        <div class="card-icon-box">🎁</div>
        <div class="card-title-group">
          <h2>Nova Recompensa</h2>
          <p>Adicione um item para troca de pontos</p>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          Senha de Administrador
        </label>
        <div class="input-wrapper">
          <input type="password" id="senha" class="input-field" placeholder="••••••••••">
          <button type="button" class="btn-toggle-pass" onclick="toggleSenha()">
            <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
          Título da Recompensa
        </label>
        <input type="text" id="titulo" class="input-field" placeholder="Ex: Capuccino Grande">
      </div>

      <div class="form-group">
        <label class="form-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
          Custo (Em Pontos)
        </label>
        <input type="number" id="pontos" class="input-field" placeholder="Ex: 80">
      </div>

      <div class="form-group">
        <label class="form-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-2.5h6l2 2.5h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z"></path><circle cx="12" cy="14" r="3.5"></circle></svg>
          Foto do Prêmio
        </label>
        <input type="file" id="foto-camera" accept="image/*" capture="environment" style="display:none;" onchange="processarArquivoFoto(event)">
        <input type="file" id="foto-galeria" accept="image/*" style="display:none;" onchange="processarArquivoFoto(event)">

        <div class="img-upload-container">
          <div class="img-preview-box" onclick="abrirModalMidia()" title="Clique para adicionar foto">
            <div id="preview-placeholder">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9a431a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 8h3l2-2.5h6l2 2.5h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z"></path>
                <circle cx="12" cy="14" r="3.5"></circle>
              </svg>
            </div>
            <img id="img-preview" style="display:none;" alt="Preview">
          </div>
          <button type="button" class="btn-select-file" id="btn-label-foto" onclick="abrirModalMidia()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 8h3l2-2.5h6l2 2.5h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z"></path>
              <circle cx="12" cy="14" r="3.5"></circle>
            </svg>
            Adicionar Imagem
          </button>
        </div>
      </div>

      <button class="btn-submit" id="btn-enviar" onclick="salvarPremio()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Adicionar ao Catálogo
      </button>

      <div id="status" class="msg-feedback"></div>
    </div>

    <!-- Card 2: Recompensas no Ar -->
    <div class="card">
      <div class="card-header-between">
        <div class="header-info">
          <div class="card-icon-box" style="font-size: 16px;">📋</div>
          <h2 style="font-size: 16px; font-weight: 700; color: #1f140e;">Recompensas no Ar</h2>
        </div>
        <button class="btn-refresh" onclick="carregarPremiosAdmin()" title="Atualizar Lista">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        </button>
      </div>

      <div id="msg-erro-lista" class="msg-feedback" style="background: #fee2e2; color: #991b1b; display:none;"></div>
      <div id="msg-sucesso-lista" class="msg-feedback" style="background: #dcfce7; color: #166534; display:none;"></div>

      <div id="lista-admin" style="margin-top: 15px;">
        <div style="text-align: center; color: #8c7e73; font-size: 13px; padding: 10px;">Carregando lista...</div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Bar com Links Reais -->
  <nav class="bottom-nav">
    <a href="admin.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      Promoções
    </a>
    <a href="admin-fidelidade.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
      Fidelidade
    </a>
  </nav>

  <!-- Modal Opções de Foto -->
  <div class="modal-overlay" id="midiaOverlay" onclick="fecharModalMidia()"></div>
  <div class="sheet-box" id="midiaSheet">
    <div class="sheet-title">Foto da Recompensa</div>
    <div class="sheet-sub">Como prefere enviar a imagem do item?</div>
    <button type="button" class="btn-media-option" onclick="acionarCamera()">
      <div class="media-icon-container">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9a431a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6l2 2.5h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z"></path><circle cx="12" cy="14" r="3.5"></circle></svg>
      </div>
      <span>Tirar Foto com a Câmera</span>
    </button>
    <button type="button" class="btn-media-option" onclick="acionarGaleria()">
      <div class="media-icon-container">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9a431a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      </div>
      <span>Escolher da Galeria</span>
    </button>
    <button type="button" class="btn-fechar-sheet" onclick="fecharModalMidia()">Cancelar</button>
  </div>

  <script>
    const API_URL = "https://scxskwkcbxfdxswwfbxy.supabase.co/functions/v1/fidelidade";
    const FOTO_PADRAO = "https://images.unsplash.com/photo-1517256064527-09c73fc73e38?w=150&q=80";
    let fotoBase64 = null;

    function abrirModalMidia() { document.getElementById('midiaOverlay').style.display = 'block'; setTimeout(() => document.getElementById('midiaSheet').classList.add('active'), 10); }
    function fecharModalMidia() { document.getElementById('midiaSheet').classList.remove('active'); setTimeout(() => document.getElementById('midiaOverlay').style.display = 'none', 300); }
    function acionarCamera() { fecharModalMidia(); document.getElementById('foto-camera').click(); }
    function acionarGaleria() { fecharModalMidia(); document.getElementById('foto-galeria').click(); }

    function toggleSenha() {
      const input = document.getElementById('senha');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    async function processarArquivoFoto(event) {
      const file = event.target.files[0];
      if (!file) return;
      const imgPreview = document.getElementById('img-preview');
      const placeholder = document.getElementById('preview-placeholder');
      const btnLabel = document.getElementById('btn-label-foto');

      btnLabel.innerText = "Processando foto...";
      try {
        fotoBase64 = await comprimirImagemParaBase64(file, 900, 0.78);
        imgPreview.src = fotoBase64;
        imgPreview.style.display = 'block';
        placeholder.style.display = 'none';
        btnLabel.innerText = "✅ Foto pronta (Trocar)";
      } catch (err) {
        alert("Erro ao processar imagem.");
        btnLabel.innerText = "Adicionar Imagem";
      }
    }

    function comprimirImagemParaBase64(file, maxDimensao, qualidade) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let { width, height } = img;
            if (width > height) { if (width > maxDimensao) { height = Math.round((height * maxDimensao) / width); width = maxDimensao; } } 
            else { if (height > maxDimensao) { width = Math.round((width * maxDimensao) / height); height = maxDimensao; } }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', qualidade));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    async function carregarPremiosAdmin() {
      const lista = document.getElementById('lista-admin');
      try {
        const res = await fetch(`${API_URL}?acao=premios&t=${Date.now()}`);
        const premios = await res.json();
        
        if (premios.error) throw new Error(premios.error);
        if(!Array.isArray(premios) || !premios.length) { lista.innerHTML = `<p style="padding:15px; color:#8c7e73; text-align:center;">Sem prêmios cadastrados.</p>`; return; }

        lista.innerHTML = premios.map(p => `
          <div class="item-promo" id="premio-${p.id}">
            <img class="promo-thumb" src="${p.imagem_url || FOTO_PADRAO}" onerror="this.src='${FOTO_PADRAO}'">
            <div class="promo-details">
              <div class="promo-title">${p.titulo}</div>
              <div class="promo-val">${p.pontos} pts</div>
            </div>
            <button class="btn-delete" id="btn-del-${p.id}" onclick="deletarPremio(${p.id})">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg> Excluir
            </button>
          </div>
        `).join('');
      } catch(e) {
        lista.innerHTML = `<p style="color:#dc2626; text-align:center; padding:10px;">${e.message}</p>`;
      }
    }

    async function salvarPremio() {
      const senha = document.getElementById('senha').value;
      const titulo = document.getElementById('titulo').value;
      const pontos = document.getElementById('pontos').value;
      const btn = document.getElementById('btn-enviar');
      const status = document.getElementById('status');
      
      limparAlertasLista();

      if(!senha || !titulo || !pontos) {
        status.style.display = "block"; status.style.background = "#fee2e2"; status.style.color = "#991b1b"; status.innerText = "❌ Preencha todos os campos."; return;
      }
      
      btn.disabled = true;
      status.style.display = 'block'; status.style.background = '#fef3c7'; status.style.color = '#92400e'; status.innerText = "Salvando prêmio...";

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ acao: 'criar_premio', senha, titulo, pontos: parseInt(pontos), imagem_base64: fotoBase64 })
        });
        
        const data = await res.json();
        // Tratamento idêntico ao painel de promoções (Protege contra erros silenciosos do Supabase)
        if (!res.ok) throw new Error(data.message || data.error || "Erro de servidor");
        if(data.error) throw new Error(data.error);

        status.style.background = '#dcfce7'; status.style.color = '#166534';
        status.innerText = "✅ Salvo com sucesso!";

        document.getElementById('titulo').value = ''; document.getElementById('pontos').value = '';
        document.getElementById('img-preview').style.display = 'none'; document.getElementById('preview-placeholder').style.display = 'flex';
        document.getElementById('btn-label-foto').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6l2 2.5h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z"></path><circle cx="12" cy="14" r="3.5"></circle></svg> Adicionar Imagem';
        fotoBase64 = null;
        
        await carregarPremiosAdmin();
      } catch (e) {
        status.style.background = '#fee2e2'; status.style.color = '#991b1b'; status.innerText = "❌ " + e.message;
      } finally { btn.disabled = false; setTimeout(() => { if(status.style.background.includes('220')) status.style.display = 'none'; }, 6000); }
    }

    async function deletarPremio(id) {
      const senha = document.getElementById('senha').value;
      const btnDel = document.getElementById(`btn-del-${id}`);
      const erroBox = document.getElementById('msg-erro-lista');
      const sucessoBox = document.getElementById('msg-sucesso-lista');

      limparAlertasLista();
      if(!senha) { erroBox.innerText = "❌ Digite a senha no topo da página para excluir."; erroBox.style.display = 'block'; document.getElementById('senha').focus(); return; }
      if(!confirm('Tem certeza que deseja excluir esta recompensa?')) return;

      if (btnDel) { btnDel.disabled = true; btnDel.innerText = "..."; }

      try {
        const res = await fetch(API_URL, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ senha, id })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || data.message || 'Falha ao excluir');

        sucessoBox.innerText = "✅ Recompensa removida!"; sucessoBox.style.display = 'block';
        const el = document.getElementById(`premio-${id}`); if(el) el.remove();
        if(document.querySelectorAll('.item-promo').length === 0) carregarPremiosAdmin();
      } catch (e) {
        erroBox.innerText = "❌ " + e.message; erroBox.style.display = 'block';
        if (btnDel) { btnDel.disabled = false; btnDel.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg> Excluir`; }
      }
    }

    function limparAlertasLista() { document.getElementById('msg-erro-lista').style.display = 'none'; document.getElementById('msg-sucesso-lista').style.display = 'none'; }
    carregarPremiosAdmin();
  </script>
</body>
