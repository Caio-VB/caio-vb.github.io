<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gerenciar Promoções</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background: #f8fafc; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 460px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    h1 { font-size: 18px; margin-bottom: 16px; color: #0f172a; }
    h2 { font-size: 16px; margin-bottom: 12px; color: #334155; }
    label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-create { background: #059669; color: white; margin-top: 6px; }
    .btn-create:disabled { background: #9ca3af; cursor: not-allowed; }
    .item-promo { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
    .item-promo:last-child { border-bottom: none; }
    .btn-delete { background: #ef4444; color: white; padding: 8px 14px; font-size: 12px; width: auto; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
    .btn-delete:disabled { background: #9ca3af; cursor: not-allowed; }
    .msg { margin-top: 10px; font-size: 13px; text-align: center; }
    .alerta-erro { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; display: none; }
    .alerta-sucesso { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>📢 Nova Promoção da Loja</h1>
    
    <label>Senha de Administrador</label>
    <input type="password" id="senha" placeholder="Digite sua senha">

    <label>Título da Promoção</label>
    <input type="text" id="titulo" placeholder="Ex: Café + Bolo por R$ 14,00">

    <label>Detalhes da Oferta</label>
    <input type="text" id="descricao" placeholder="Ex: Válido até 05/09/2026">

    <label>Validade</label>
    <input type="text" id="validade" placeholder="Ex: Válido até 05/09/2026">

    <button class="btn-create" id="btn-enviar" onclick="cadastrarPromocao()">🚀 Publicar e Disparar Notificação</button>
    <div id="status" class="msg"></div>
  </div>

  <div class="card">
    <h2>Promoções no Ar</h2>
    
    <div id="msg-erro-lista" class="alerta-erro"></div>
    <div id="msg-sucesso-lista" class="alerta-sucesso"></div>

    <div id="lista-promocoes">Carregando promoções...</div>
  </div>
</div>

<script>
  const API_URL = "https://scxskwkcbxfdxswwfbxy.supabase.co/functions/v1/promocoes";

  async function carregarPromocoes() {
    const lista = document.getElementById('lista-promocoes');
    try {
      const res = await fetch(`${API_URL}?t=${Date.now()}`);
      const promocoes = await res.json();
      
      if (!res.ok || !Array.isArray(promocoes)) {
        throw new Error(promocoes.error || 'Erro ao carregar banco');
      }

      if (!promocoes.length) {
        lista.innerHTML = "<p style='color: #64748b; font-size: 13px;'>Nenhuma promoção ativa no momento.</p>";
        return;
      }

      lista.innerHTML = promocoes.map(p => `
        <div class="item-promo" id="promo-${p.id}">
          <div style="padding-right: 10px;">
            <strong>${p.titulo}</strong><br>
            <small style="color: #475569;">${p.descricao}</small><br>
            <small style="color: #059669; font-weight: 600;">⏰ ${p.validade}</small>
          </div>
          <button class="btn-delete" id="btn-del-${p.id}" onclick="deletarPromocao(${p.id})">Excluir</button>
        </div>
      `).join('');
    } catch (e) {
      lista.innerHTML = `<p style='color: #ef4444;'>Erro ao carregar lista: ${e.message}</p>`;
    }
  }

  async function cadastrarPromocao() {
    const senha = document.getElementById('senha').value;
    const titulo = document.getElementById('titulo').value;
    const descricao = document.getElementById('descricao').value;
    const validade = document.getElementById('validade').value;
    const btn = document.getElementById('btn-enviar');
    const status = document.getElementById('status');

    limparAlertasLista();

    if (!senha || !titulo || !descricao || !validade) {
      status.style.color = "#ef4444";
      status.innerText = "❌ Preencha todos os campos e a senha.";
      return;
    }

    btn.disabled = true;
    status.style.color = "#0284c7";
    status.innerText = "Salvando promoção e enviando notificação...";

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senha, titulo, descricao, validade })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || data.message || 'Falha ao cadastrar');

      status.style.color = "#059669";
      status.innerText = `✅ Promoção salva e notificação enviada para ${data.destinatarios} aparelho(s)!`;
      
      document.getElementById('titulo').value = '';
      document.getElementById('descricao').value = '';
      document.getElementById('validade').value = '';
      
      await carregarPromocoes();
    } catch (err) {
      status.style.color = "#ef4444";
      status.innerText = "❌ " + err.message;
    } finally {
      btn.disabled = false;
    }
  }

  async function deletarPromocao(id) {
    const senha = document.getElementById('senha').value;
    const btnDel = document.getElementById(`btn-del-${id}`);
    const erroBox = document.getElementById('msg-erro-lista');
    const sucessoBox = document.getElementById('msg-sucesso-lista');

    limparAlertasLista();

    if (!senha) {
      erroBox.innerText = "❌ Digite a senha no campo 'Senha de Administrador' lá em cima para poder excluir.";
      erroBox.style.display = 'block';
      document.getElementById('senha').focus();
      return;
    }

    if (!confirm('Deseja realmente remover esta promoção?')) return;

    if (btnDel) {
      btnDel.disabled = true;
      btnDel.innerText = "...";
    }

    try {
      const res = await fetch(API_URL, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, senha })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || data.message || 'Falha ao excluir');

      sucessoBox.innerText = "✅ Promoção removida com sucesso!";
      sucessoBox.style.display = 'block';

      const elemento = document.getElementById(`promo-${id}`);
      if (elemento) elemento.remove();

      await carregarPromocoes();
    } catch (err) {
      erroBox.innerText = "❌ Erro ao excluir: " + err.message;
      erroBox.style.display = 'block';
      if (btnDel) {
        btnDel.disabled = false;
        btnDel.innerText = "Excluir";
      }
    }
  }

  function limparAlertasLista() {
    const erro = document.getElementById('msg-erro-lista');
    const sucesso = document.getElementById('msg-sucesso-lista');
    if (erro) erro.style.display = 'none';
    if (sucesso) sucesso.style.display = 'none';
  }

  carregarPromocoes();
</script>

</body>
</html>
