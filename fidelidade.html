<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cafeteria - Clube Fidelidade</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#200d02">

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f6f3ee; color: #1e140d; min-height: 100vh; padding-bottom: 90px; }

    /* Top Bar */
    .top-header {
      background: linear-gradient(180deg, #3d1c06 0%, #200d02 100%);
      padding: 24px 20px 32px 20px;
      border-radius: 0 0 24px 24px;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 18px rgba(32, 13, 2, 0.25);
    }
    .header-info { display: flex; align-items: center; gap: 12px; }
    .header-logo {
      width: 44px; height: 44px; background: #faece3; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); flex-shrink: 0; margin-right: 12px;
    }
    .header-title { font-size: 18px; font-weight: 700; color: #ffffff; line-height: 1.2; }
    .header-sub { font-size: 12px; color: #d6bda8; margin-top: 3px; }

    /* Container Central */
    .container { max-width: 460px; margin: -14px auto 0; padding: 0 16px; }

    /* Cards Genéricos */
    .card { background: #ffffff; border-radius: 20px; padding: 20px; margin-bottom: 16px; border: 1px solid #efe8df; box-shadow: 0 3px 12px rgba(45, 24, 8, 0.04); }
    
    /* Botões */
    .btn-action { width: 100%; border: none; border-radius: 14px; padding: 14px 16px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform 0.1s; }
    .btn-action:active { transform: scale(0.98); }
    .btn-primary { background: linear-gradient(135deg, #a0461b 0%, #8c3b12 100%); color: #ffffff; box-shadow: 0 4px 12px rgba(140, 59, 18, 0.25); }
    .btn-secondary { background: #faece3; color: #9a431a; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-top: 10px; }

    /* Painel de Pontos */
    .points-panel { text-align: center; padding: 10px 0 20px; }
    .points-value { font-size: 48px; font-weight: 800; color: #1f140e; line-height: 1; display: flex; justify-content: center; align-items: baseline; gap: 6px; }
    .points-value span { font-size: 16px; font-weight: 700; color: #9a431a; }
    .points-label { font-size: 13px; color: #786b62; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; }
    
    /* Avisos */
    .alert-box { background: #fffbeb; border: 1px dashed #f59e0b; border-radius: 12px; padding: 12px; display: flex; align-items: flex-start; gap: 10px; margin-bottom: 16px; }
    .alert-icon { font-size: 18px; flex-shrink: 0; }
    .alert-text { font-size: 12px; color: #92400e; line-height: 1.4; }
    .alert-text button { background: none; border: none; color: #b45309; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; margin-top: 4px; font-size: 12px; }
    
    /* Scanner Otimizado */
    #reader-container { display: none; margin-top: 16px; border-radius: 16px; overflow: hidden; border: 2px solid #9a431a; background: #000; }
    #reader { width: 100%; border: none; }
    #reader video { object-fit: cover !important; width: 100% !important; border-radius: 14px !important; }

    /* Vitrine de Prêmios (Cards Grandes) */
    .section-title { font-size: 16px; font-weight: 700; color: #403024; margin: 24px 4px 12px; }
    .loading-box { text-align: center; color: #8c7e73; font-size: 13px; padding: 30px 10px; }

    .card-promo {
      background: #ffffff; border-radius: 20px; overflow: hidden; margin-bottom: 16px;
      border: 1px solid #efe8df; box-shadow: 0 3px 12px rgba(45, 24, 8, 0.04);
    }
    .promo-media { width: 100%; height: 180px; object-fit: cover; background: #f0ebe4; display: block; }
    .promo-body { padding: 16px 18px 18px; }
    .badge-promo {
      display: inline-block; background: #faece3; color: #9a431a; font-size: 11px; font-weight: 700;
      padding: 3px 9px; border-radius: 8px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .promo-title { font-size: 18px; font-weight: 700; color: #1e140d; margin-bottom: 4px; line-height: 1.3; }
    
    .reward-cost { font-size: 14px; color: #9a431a; font-weight: 800; background: #faece3; padding: 8px 12px; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px;}

    /* Barra Inferior (Bottom Nav) */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #ffffff;
      border-top: 1px solid #eee8df; display: flex; justify-content: space-around; align-items: center; z-index: 100;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px;
      font-weight: 600; color: #94877d; text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .nav-item.active { color: #a0461b; }
    .nav-item svg { width: 22px; height: 22px; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-header">
    <div class="header-logo">
      <img src="https://cdn-icons-png.flaticon.com/512/924/924514.png" alt="Logo" style="width: 24px; height: 24px; object-fit: contain;">
    </div>
    <div>
      <div class="header-title">Cafeteria da Esquina</div>
      <div class="header-sub" id="header-id">Gerando seu passe...</div>
    </div>
  </header>

  <div class="container">
    <div id="alerta-vincular" class="alert-box">
      <div class="alert-icon">⚠️</div>
      <div class="alert-text">
        Seus pontos estão salvos apenas neste aparelho. Se você formatar o celular, perderá seu saldo.
        <br><button onclick="vincularTelefone()">Vincular meu WhatsApp para proteger</button>
      </div>
    </div>

    <div class="card">
      <div class="points-panel">
        <div class="points-value" id="user-pontos">-- <span>pts</span></div>
        <div class="points-label">Saldo Atual</div>
      </div>
      
      <button class="btn-action btn-primary" onclick="iniciarScanner()" id="btn-scan">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4h4v4H4z"></path><path d="M4 16h4v4H4z"></path><path d="M16 4h4v4h-4z"></path><path d="M16 16h4v4h-4z"></path><path d="M12 12h.01"></path><path d="M8 12h.01"></path><path d="M12 16h.01"></path><path d="M16 12h.01"></path><path d="M12 8h.01"></path></svg>
        Ler QR Code da Nota Fiscal
      </button>
      
      <div id="reader-container">
        <div id="reader"></div>
        <button class="btn-action btn-secondary" style="margin-top: 12px;" onclick="pararScanner()">Cancelar Leitura</button>
      </div>
    </div>

    <div class="section-title">Troque seus pontos</div>
    
    <!-- Lista de Prêmios com o Novo Design -->
    <div id="lista-premios">
      <div class="loading-box">Carregando vitrine...</div>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      Ofertas
    </a>
    <a href="fidelidade.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
      Fidelidade
    </a>
  </nav>

  <script>
    const API_URL = "https://scxskwkcbxfdxswwfbxy.supabase.co/functions/v1/fidelidade";
    const FOTO_PADRAO = "https://images.unsplash.com/photo-1517256064527-09c73fc73e38?w=500&q=80";
    let html5QrcodeScanner = null;
    let meuDeviceId = null;

    function gerarIdAparelho() { return 'cafe_' + Math.random().toString(36).substring(2, 10); }

    async function inicializarApp() {
      meuDeviceId = localStorage.getItem('fidelidade_device_id');
      if (!meuDeviceId) { meuDeviceId = gerarIdAparelho(); localStorage.setItem('fidelidade_device_id', meuDeviceId); }
      document.getElementById('header-id').innerText = "ID: " + meuDeviceId.toUpperCase();
      await carregarMeusPontos();
      await carregarPremios();
    }

    async function carregarMeusPontos() {
      try {
        const res = await fetch(`${API_URL}?acao=pontos&device_id=${meuDeviceId}&t=${Date.now()}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        document.getElementById('user-pontos').innerHTML = `${data.pontos} <span>pts</span>`;
        if (data.telefone) document.getElementById('alerta-vincular').style.display = 'none';
      } catch (e) { document.getElementById('user-pontos').innerHTML = `Erro`; }
    }

    async function carregarPremios() {
      try {
        const res = await fetch(`${API_URL}?acao=premios&t=${Date.now()}`);
        const premios = await res.json();
        const lista = document.getElementById('lista-premios');
        
        if (premios.error) throw new Error(premios.error);
        if(!Array.isArray(premios) || !premios.length) { lista.innerHTML = `<div class="loading-box">Nenhum prêmio disponível no momento.</div>`; return; }

        lista.innerHTML = premios.map(p => `
          <div class="card-promo">
            <img class="promo-media" src="${p.imagem_url || FOTO_PADRAO}" onerror="this.src='${FOTO_PADRAO}'">
            <div class="promo-body">
              <span class="badge-promo">Recompensa</span>
              <h3 class="promo-title">${p.titulo}</h3>
              
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px;">
                <div class="reward-cost">
                  ${p.pontos} pts
                </div>
                <button class="btn-action btn-secondary" style="width: auto; margin: 0; padding: 10px 20px;" onclick="resgatarPremio(${p.id}, '${p.titulo}')">Resgatar</button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) { console.error(e); document.getElementById('lista-premios').innerHTML = `<div class="loading-box" style="color:#dc2626;">Erro ao carregar os prêmios.</div>`; }
    }

    async function resgatarPremio(id, titulo) {
      if(!confirm(`Deseja gastar seus pontos para resgatar: ${titulo}?`)) return;
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ acao: 'resgatar', device_id: meuDeviceId, premio_id: id })
        });
        const data = await res.json();
        if(data.error) throw new Error(data.error);
        
        alert(`Resgate confirmado!\nMostre essa tela no balcão.\nSeu novo saldo é de: ${data.saldoFinal} pts`);
        document.getElementById('user-pontos').innerHTML = `${data.saldoFinal} <span>pts</span>`;
      } catch (e) { alert("Erro: " + e.message); }
    }

    async function vincularTelefone() {
      const zap = prompt("Digite seu WhatsApp (apenas números):");
      if(zap && zap.length >= 10) {
        try {
          const res = await fetch(API_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ acao: 'vincular_telefone', device_id: meuDeviceId, telefone: zap })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          document.getElementById('alerta-vincular').style.display = 'none';
          alert("Vinculado com sucesso!");
        } catch (e) { alert("Erro ao vincular."); }
      }
    }

    function iniciarScanner() {
      document.getElementById('btn-scan').style.display = 'none';
      document.getElementById('reader-container').style.display = 'block';
      
      if (html5QrcodeScanner) {
        try { html5QrcodeScanner.clear(); } catch(e) {}
      }

      html5QrcodeScanner = new Html5Qrcode("reader");
      
      const config = {
        fps: 15,
        aspectRatio: 1.0, 
        formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ], 
        qrbox: (viewfinderWidth, viewfinderHeight) => {
          const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
          // Reduzimos o alvo para 60%. O cliente vai afastar o celular instintivamente para a nota caber aqui, resolvendo o desfoque!
          return { width: minEdge * 0.60, height: minEdge * 0.60 };
        }
      };

      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        config,
        (decodedText) => { pararScanner(); processarNotaFiscal(decodedText); }, 
        (error) => {} 
      ).catch(err => { 
        alert("Erro ao acessar a câmera: " + (err.message || err)); 
        pararScanner(); 
      });
    }
    
    function pararScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('btn-scan').style.display = 'flex';
          document.getElementById('reader-container').style.display = 'none';
        });
      }
    }

    async function processarNotaFiscal(urlQrcode) {
      document.getElementById('btn-scan').innerText = "Validando nota...";
      document.getElementById('btn-scan').disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ acao: 'processar_nota', device_id: meuDeviceId, url_nota: urlQrcode })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        document.getElementById('user-pontos').innerHTML = `${data.novosPontos} <span>pts</span>`;
        alert(`✅ Nota validada! Você ganhou ${data.pontosGanhos} pontos.`);
      } catch (e) { alert("❌ Falha: " + e.message); } 
      finally {
        document.getElementById('btn-scan').innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4h4v4H4z"></path><path d="M4 16h4v4H4z"></path><path d="M16 4h4v4h-4z"></path><path d="M16 16h4v4h-4z"></path><path d="M12 12h.01"></path><path d="M8 12h.01"></path><path d="M12 16h.01"></path><path d="M16 12h.01"></path><path d="M12 8h.01"></path></svg> Ler QR Code da Nota Fiscal';
        document.getElementById('btn-scan').disabled = false;
      }
    }

    inicializarApp();
  </script>
</body>
</html>
