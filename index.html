<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promoções da Loja</title>

  <!-- PWA Tags para iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Promoções">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/726/726476.png">
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f8fafc; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; }
    header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 380px; }
    h1 { font-size: 22px; color: #0f172a; font-weight: 800; }
    p { font-size: 14px; color: #64748b; margin-top: 4px; }

    /* Botões de Ação */
    .btn-action {
      width: 100%;
      max-width: 380px;
      font-weight: bold;
      padding: 13px;
      border: none;
      border-radius: 10px;
      margin-bottom: 12px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    #btn-instalar-android { display: none; background: #2563eb; color: white; }
    #btn-guia-ios { display: none; background: #0f172a; color: white; }
    #btn-ativar { background: #059669; color: white; }

    /* Cards de Promoção */
    .container-promos { width: 100%; max-width: 380px; }
    .card-promo { 
      background: white; 
      border-radius: 14px; 
      padding: 18px; 
      margin-bottom: 14px; 
      box-shadow: 0 3px 8px rgba(0,0,0,0.04); 
      border: 1px solid #e2e8f0;
      position: relative;
    }
    .badge {
      display: inline-block;
      background: #fef2f2;
      color: #dc2626;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .promo-title { font-weight: 700; color: #0f172a; font-size: 17px; margin-bottom: 6px; }
    .promo-desc { font-size: 14px; color: #475569; line-height: 1.4; margin-bottom: 12px; }
    .promo-validade { font-size: 12px; color: #059669; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .loading-box { text-align: center; color: #64748b; font-size: 14px; margin-top: 30px; }

    /* Modal Guia iOS */
    .ios-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 999; }
    .ios-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; border-radius: 20px 20px 0 0; padding: 24px 20px 30px; max-width: 450px; margin: 0 auto; z-index: 1000; transform: translateY(100%); transition: transform 0.3s ease-out; }
    .ios-sheet.active { transform: translateY(0); }
    .sheet-title { font-size: 17px; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .sheet-sub { font-size: 13px; color: #64748b; text-align: center; margin-bottom: 20px; }
    .step-item { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .step-icon { width: 36px; height: 36px; background: #f1f5f9; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .step-text { font-size: 14px; color: #334155; }
    .btn-fechar-sheet { width: 100%; background: #f1f5f9; color: #334155; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
  </style>

  <!-- OneSignal SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "3848f19b-f5ef-45a5-a307-ad0a89725eb1",
      });
    });

    async function ativarNotificacoes() {
        const btn = document.getElementById('btn-ativar');
        if (btn) btn.disabled = true;

        window.OneSignalDeferred = window.OneSignalDeferred || [];
        window.OneSignalDeferred.push(async function(OneSignal) {
            try {
            // 1. Pede permissão nativa
            await OneSignal.Notifications.requestPermission();

            // 2. Força o opt-in direto
            await OneSignal.User.PushSubscription.optIn();

            // Aguarda 1.5s para o OneSignal sincronizar com os servidores
            await new Promise(r => setTimeout(r, 1500));

            const sub = OneSignal.User.PushSubscription;
            
            // Diagnóstico na tela
            if (sub.optedIn && sub.id) {
                alert("✅ Conectado com sucesso!\nID do Aparelho: " + sub.id.substring(0, 8) + "...");
            } else {
                // Se ainda não ativou, força a chamada do evento de permissão
                await OneSignal.User.PushSubscription.optIn();
                alert("Status: " + (sub.optedIn ? "Ativo" : "Pendente de sincronização") + "\nRecarregue a página uma vez.");
            }

            } catch (e) {
            alert("Erro ao registrar: " + e.message);
            } finally {
            if (btn) btn.disabled = false;
            }
        });
    }
    </script>
</head>
<body>

  <header>
    <h1>Cafeteria & Cia</h1>
    <p>Promoções e ofertas exclusivas direto no seu celular.</p>
  </header>

  <button id="btn-instalar-android" class="btn-action">📲 Instalar Aplicativo</button>
  <button id="btn-guia-ios" class="btn-action" onclick="abrirGuiaIos()">📲 Como Adicionar à Tela de Início</button>
  <button id="btn-ativar" class="btn-action" onclick="ativarNotificacoes()">🔔 Receber Avisos de Promoções</button>

  <div class="container-promos" id="lista-promos">
    <div class="loading-box">Carregando promoções de hoje...</div>
  </div>

  <!-- Modal do iPhone -->
  <div class="ios-modal-overlay" id="iosOverlay" onclick="fecharGuiaIos()"></div>
  <div class="ios-sheet" id="iosSheet">
    <div class="sheet-title">Instalar na Tela de Início</div>
    <div class="sheet-sub">Adicione o aplicativo ao seu iPhone em 2 passos:</div>

    <div class="step-item">
      <div class="step-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
          <polyline points="16 6 12 2 8 6"/>
          <line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
      </div>
      <div class="step-text">1. Na barra inferior do Safari, toque em <strong>Compartilhar</strong>.</div>
    </div>

    <div class="step-item">
      <div class="step-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="12" y1="8" x2="12" y2="16"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
      </div>
      <div class="step-text">2. Role o menu e toque em <strong>Adicionar à Tela de Início</strong>.</div>
    </div>

    <button class="btn-fechar-sheet" onclick="fecharGuiaIos()">Entendido</button>
  </div>

  <script>
    // COLOQUE AQUI A URL DA SUA FUNÇÃO DO SUPABASE
    const API_URL = "https://scxskwkcbxfdxswwfbxy.supabase.co/functions/v1/promocoes";

    async function buscarPromocoes() {
      const container = document.getElementById('lista-promos');
      try {
        const res = await fetch(`${API_URL}?t=${Date.now()}`, { cache: 'no-store' });
        const promocoes = await res.json();

        if (!promocoes.length) {
          container.innerHTML = "<p class='loading-box'>Nenhuma promoção ativa no momento. Fique atento às próximas notificações!</p>";
          return;
        }

        container.innerHTML = promocoes.map(p => `
          <div class="card-promo">
            <span class="badge">Oferta Ativa</span>
            <div class="promo-title">${p.titulo}</div>
            <div class="promo-desc">${p.descricao}</div>
            <div class="promo-validade">⏰ ${p.validade}</div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = "<p class='loading-box'>Erro ao carregar promoções.</p>";
      }
    }

    buscarPromocoes();

    // Controles de Instalação PWA
    const isIos = () => /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    const btnAndroid = document.getElementById('btn-instalar-android');
    const btnIos = document.getElementById('btn-guia-ios');
    const iosOverlay = document.getElementById('iosOverlay');
    const iosSheet = document.getElementById('iosSheet');

    if (isIos() && !isStandalone) btnIos.style.display = 'flex';

    function abrirGuiaIos() {
      iosOverlay.style.display = 'block';
      setTimeout(() => iosSheet.classList.add('active'), 10);
    }

    function fecharGuiaIos() {
      iosSheet.classList.remove('active');
      setTimeout(() => iosOverlay.style.display = 'none', 300);
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone) btnAndroid.style.display = 'flex';
    });

    btnAndroid.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') btnAndroid.style.display = 'none';
        deferredPrompt = null;
      }
    });
  </script>
</body>
</html>
